server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (React Router) aren't real files — fall back to index.html so
    # direct navigation/refresh on e.g. /login doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser calls /api/v1/*, nginx forwards it to the backend
    # container. The variable + resolver (Docker's embedded DNS) lets nginx start even if the
    # backend isn't up yet, and re-resolve if the backend container is recreated. With a
    # variable and no URI in proxy_pass, the original /api/v1/... path is passed unchanged.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
