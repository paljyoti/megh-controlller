server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (React Router) aren't real files — fall back to index.html so
    # direct navigation/refresh on e.g. /login doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
